    <template id="terms-content">
      <article>
        <h2>축제은행 이용약관</h2>
        <p><strong>시행일:</strong> 12월 29일</p>
        <h3>제1조 목적</h3>
        <p>본 약관은 순천복성고등학교 학생회 전자 금융 서비스(이하 “서비스”)의 이용 조건과 이용자 및 운영자의 권리·의무를 정합니다. 서비스는 학교 축제 기간의 교내 포인트 결제와 정산을 위해 운영되며, 포인트는 법정화폐·전자금융거래 수단·외부 송금 수단이 아닙니다.</p>
        <h3>제2조 가입과 계정</h3>
        <p>이용자는 본인의 정확한 이름과 학번을 입력하고, 이메일·Google·GitHub 중 하나의 인증 방식으로 가입을 신청합니다. 가입 신청 계정은 운영자의 승인 후 이용할 수 있습니다. 이용자는 자신의 계정과 인증 정보를 제3자에게 양도·대여·공유해서는 안 됩니다.</p>
        <h3>제3조 포인트와 결제</h3>
        <p>포인트의 충전·환불 기준과 운영 시간은 학교 축제 운영 공지에 따릅니다. 상점은 등록한 상품과 가격으로 임시 주문 QR을 생성하며, 주문 QR은 생성 뒤 5분 동안 한 번만 결제할 수 있습니다. 이용자는 QR을 인식한 뒤 상점명, 상품, 수량, 금액을 확인하고 결제해야 합니다. 결제가 완료되면 해당 금액은 이용자 포인트에서 차감되어 상점 계정에 반영됩니다.</p>
        <h3>제4조 이용 제한과 오류 처리</h3>
        <p>타인의 계정 사용, QR 위·변조, 허위 주문 생성, 시스템의 비정상적 이용 또는 운영 방해가 확인되면 운영자는 해당 계정의 이용을 제한하거나 거래를 조사할 수 있습니다. 결제 오류·중복 결제·QR 오류가 발생한 경우 이용자는 재시도하기 전에 상점 담당자 또는 운영자에게 알려 거래 기록을 확인해야 합니다.</p>
        <h3>제5조 회원 탈퇴</h3>
        <p>이용자는 설정 페이지에서 재인증을 거쳐 회원 탈퇴를 요청할 수 있습니다. 탈퇴가 완료되면 서버에서 인증 계정과 서비스의 사용자 프로필은 삭제됩니다. 다만 이미 발생한 거래 기록은 축제 정산, 오류 처리 및 감사에 필요한 기간 동안 보관될 수 있습니다.</p>
        <h3>제6조 공지와 문의</h3>
        <p>운영 시간, 환전소, 환불 기준, 담당자 및 본 약관의 변경 사항은 서비스 공지 또는 사이트 정보 페이지를 통해 안내합니다. 개인정보 및 서비스 문의는 사이트 정보 페이지에 게시된 담당자에게 할 수 있습니다.</p>
      </article>
    </template>

    <template id="privacy-content">
      <article>
        <h2>개인정보 수집·이용 안내</h2>
        <p><strong>시행일:</strong> 12월 29일</p>
        <h3>개인정보처리자</h3>
        <p>서비스 운영 담당자입니다. 개인정보 보호책임자와 문의처는 사이트 정보 페이지에 게시된 최신 내용을 따릅니다.</p>
        <h3>수집 항목</h3>
        <p><strong>가입·계정 관리:</strong> 이름, 학번, 이메일 주소, 사용자 식별자, 로그인 인증 제공자(이메일·Google·GitHub), 계정 권한과 승인 상태</p>
        <p><strong>포인트 환급:</strong> 은행명, 계좌번호, 예금주명</p>
        <p><strong>포인트·거래 관리:</strong> 포인트 잔액, 충전·환불·포인트 조절 기록, 결제 일시·금액·상대 상점·주문 상품 및 수량, 거래 처리자 식별자</p>
        <h3>수집·이용 목적</h3>
        <p>가입자 본인 확인, 중복 가입과 부정 이용 방지, 계정 권한 관리, 축제 포인트 결제·계좌이체 환급·정산, 결제 오류 및 민원 처리, 시스템 보안 점검을 위해 이용합니다. 수집한 정보는 위 목적 외로 이용하지 않습니다.</p>
        <h3>보관 및 파기</h3>
        <p>가입자 프로필·환급 계좌 정보·인증 계정은 회원 탈퇴 시 삭제합니다. 거래 기록은 축제 정산, 오류 처리 및 감사에 필요한 기간 동안 보관하고, 정산이 종료되어 보관 사유가 없어지면 운영자가 지체 없이 파기합니다. 법령상 별도 보관 의무가 있는 경우에는 해당 기간 동안 보관할 수 있습니다.</p>
        <h3>처리 위탁 및 제공</h3>
        <p>서비스는 Firebase Authentication과 Cloud Firestore를 이용해 인증 및 데이터를 처리합니다. 본교 학생회는 서비스 운영에 필요한 범위에서만 이를 사용하며, 제3자에게 개인정보를 판매하거나 광고 목적으로 제공하지 않습니다. 국외 이전·처리위탁의 구체적 사항은 학생회의 Firebase 설정과 운영 기준을 확인한 후 사이트 정보 페이지에 추가로 안내합니다.</p>
        <h3>정보주체의 권리</h3>
        <p>이용자는 자신의 개인정보 열람·정정·삭제·처리정지를 요청할 수 있으며, 회원 탈퇴를 요청할 수 있습니다. 거래 정산에 이미 사용된 정보는 정산 완료 전까지 즉시 삭제되지 않을 수 있습니다.</p>
        <h3>동의 거부 권리</h3>
        <p>이용자는 개인정보 수집·이용에 동의하지 않을 권리가 있습니다. 다만 계정 확인과 포인트 결제에 필요한 최소 정보의 처리에 동의하지 않으면 서비스 가입 및 이용이 제한됩니다.</p>
      </article>
