<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="theme-color" content="#12372a"/>
    <title>회원가입 | 복성고 축제은행</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 아래 두 template의 본문을 학교 운영 기준에 맞게 직접 수정하세요. -->
    <template id="terms-content">
      <article>
        <h2>축제은행 이용약관</h2>
        <p><strong>시행일:</strong> [시행일을 입력하세요]</p>
        <h3>제1조 목적</h3>
        <p>[이용약관의 목적과 적용 범위를 입력하세요.]</p>
        <h3>제2조 서비스 이용</h3>
        <p>[계정, 포인트 충전, 결제, 환불 및 이용 제한 내용을 입력하세요.]</p>
        <h3>제3조 이용자의 의무</h3>
        <p>[계정 관리와 부정 이용 방지에 관한 내용을 입력하세요.]</p>
        <h3>제4조 기타</h3>
        <p>[분쟁 처리와 문의 방법 등 필요한 내용을 입력하세요.]</p>
      </article>
    </template>

    <template id="privacy-content">
      <article>
        <h2>개인정보 수집·이용 안내</h2>
        <p><strong>시행일:</strong> [시행일을 입력하세요]</p>
        <h3>수집 항목</h3>
        <p>[이름, 학번, 이메일 등 실제 수집 항목을 입력하세요.]</p>
        <h3>수집·이용 목적</h3>
        <p>[본인 확인, 계정 관리, 결제 및 정산 등 이용 목적을 입력하세요.]</p>
        <h3>보유 및 이용 기간</h3>
        <p>[축제 종료 후 삭제 시점 등 보유 기간을 입력하세요.]</p>
        <h3>동의 거부 권리</h3>
        <p>[동의 거부 시 서비스 이용 제한 내용을 입력하세요.]</p>
      </article>
    </template>

    <script type="module" src="/js/main.jsx"></script>
  </body>
</html>
