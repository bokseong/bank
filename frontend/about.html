<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="theme-color" content="#12372a"/>
    <title>사이트 정보 | 복성고 축제은행</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- 담당자가 정해지면 아래의 '입력 필요' 부분만 수정하세요. -->
    <template id="site-contact-content">
      <dl class="contact-list">
        <div><dt>총 책임자 이메일</dt><dd>입력 필요</dd></div>
        <div><dt>보안 담당자 이메일</dt><dd>입력 필요</dd></div>
        <div><dt>개인정보 담당자 이메일</dt><dd>입력 필요</dd></div>
        <div><dt>현금 조절 대표 담당자 이메일</dt><dd>입력 필요</dd></div>
        <div><dt>환전소 위치</dt><dd>입력 필요</dd></div>
      </dl>
    </template>
    <template id="terms-content">
      <article>
        <h2>축제은행 이용약관</h2>
        <p>본 서비스는 학교 축제 기간의 교내 포인트 결제와 정산을 위해 운영됩니다. 포인트는 법정화폐, 전자금융거래 수단 또는 외부 송금 수단이 아닙니다.</p>
        <h3>계정과 이용</h3>
        <p>계정은 운영자가 발급·관리합니다. 이용자는 본인 계정과 인증 정보를 제3자와 공유해서는 안 되며, 부정 이용이 확인되면 운영자는 이용을 제한할 수 있습니다.</p>
        <h3>결제와 환불</h3>
        <p>포인트 충전·결제·환불 기준은 축제 운영 공지에 따릅니다. 결제 오류나 중복 결제가 의심되면 상점 담당자 또는 운영자에게 거래 기록 확인을 요청해야 합니다.</p>
      </article>
    </template>
    <template id="privacy-content">
      <article>
        <h2>개인정보 수집·이용 안내</h2>
        <h3>수집 항목</h3>
        <p>이름, 학번, 이메일 주소, 사용자 식별자, 로그인 인증 제공자, 계정 권한·상태, 포인트 잔액 및 거래 기록을 수집합니다.</p>
        <h3>이용 목적과 보관</h3>
        <p>계정 관리, 포인트 결제·정산, 부정 이용 방지, 오류 처리와 보안 점검을 위해 사용합니다. 계좌번호 등 계좌이체 정보는 수집하지 않습니다. 거래 기록은 정산과 감사에 필요한 기간 동안 보관합니다.</p>
      </article>
    </template>
    <script type="module" src="/js/main.jsx"></script>
  </body>
</html>
